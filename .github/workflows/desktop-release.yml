name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v; defaults to package.json"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  app-bundle:
    needs: release-info
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build app bundle archive
        run: npm run prepack

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: dist/orion-app-${{ needs.release-info.outputs.version }}.tar.gz
          if-no-files-found: error

  desktop:
    needs:
      - release-info
      - app-bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            arch: arm64
            builder: mac
            updateChannel: latest-arm64
          - os: windows-latest
            target: win32-x64
            arch: x64
            builder: win
            updateChannel: latest-win-x64

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
      ORION_DESKTOP_TARGET: ${{ matrix.target }}
      ORION_HOME_DIR: ${{ github.workspace }}/.orion-desktop-home

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build orion-ui wheel
        run: |
          python -m pip install --upgrade build
          python -m build
        working-directory: python/orion-ui

      - name: Download app bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: dist

      - name: Extract app bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/orion-app
          tar -xzf "dist/orion-app-${{ needs.release-info.outputs.version }}.tar.gz" -C dist/orion-app

      - name: Cache desktop runtime downloads
        uses: actions/cache@v4
        with:
          path: |
            dist/desktop-runtime/downloads
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: desktop-runtime-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('scripts/prepare-desktop-runtime.mjs', 'python/orion-ui/pyproject.toml', 'python/orion-ui/orion_ui/**') }}
          restore-keys: |
            desktop-runtime-${{ runner.os }}-${{ matrix.target }}-

      - name: Prepare desktop package inputs
        env:
          APPDATA: ${{ github.workspace }}/.appdata
          HOME: ${{ github.workspace }}
          LOCALAPPDATA: ${{ github.workspace }}/.localappdata
          USERPROFILE: ${{ github.workspace }}
        run: npm run build:desktop-main && npm run prepare:desktop-runtime

      - name: Package macOS app
        if: matrix.builder == 'mac'
        env:
          ORION_ADHOC_MAC_SIGNING: "1"
        run: npx electron-builder --mac dmg zip --publish never -c.mac.identity=null -c.mac.hardenedRuntime=false

      - name: Package Windows app
        if: matrix.builder == 'win'
        shell: pwsh
        run: npx electron-builder --win nsis --publish never

      - name: Prepare macOS release assets
        if: matrix.builder == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          cp dist/electron/Orion-${{ needs.release-info.outputs.version }}-mac-${{ matrix.arch }}.dmg dist/release-assets/
          cp dist/electron/Orion-${{ needs.release-info.outputs.version }}-mac-${{ matrix.arch }}.zip dist/release-assets/
          cp dist/electron/latest-mac.yml "dist/release-assets/${{ matrix.updateChannel }}-mac.yml"
          find dist/electron -maxdepth 1 -type f -name "*.blockmap" -exec cp {} dist/release-assets/ \;
          (cd dist/release-assets && shasum -a 256 * > "SHA256SUMS-${{ matrix.target }}.txt")

      - name: Prepare Windows release assets
        if: matrix.builder == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\release-assets | Out-Null
          Copy-Item "dist\electron\Orion-Setup-${{ needs.release-info.outputs.version }}-win-x64.exe" dist\release-assets\
          Copy-Item "dist\electron\latest.yml" "dist\release-assets\${{ matrix.updateChannel }}.yml"
          Get-ChildItem dist\electron -Filter "*.blockmap" | Copy-Item -Destination dist\release-assets\
          Get-ChildItem dist\release-assets -File | Where-Object { $_.Name -notlike "SHA256SUMS-*.txt" } | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Out-File -FilePath "dist\release-assets\SHA256SUMS-${{ matrix.target }}.txt" -Encoding utf8

      - name: Upload desktop assets to release
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/release-assets/*
          if-no-files-found: error

  desktop-intel:
    needs:
      - release-info
      - app-bundle
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
      ORION_DESKTOP_TARGET: darwin-x64
      ORION_HOME_DIR: ${{ github.workspace }}/.orion-desktop-home

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build orion-ui wheel
        run: |
          python -m pip install --upgrade build
          python -m build
        working-directory: python/orion-ui

      - name: Download app bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: dist

      - name: Extract app bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/orion-app
          tar -xzf "dist/orion-app-${{ needs.release-info.outputs.version }}.tar.gz" -C dist/orion-app

      - name: Cache desktop runtime downloads
        uses: actions/cache@v4
        with:
          path: |
            dist/desktop-runtime/downloads
            ~/.cache/pip
            ~/Library/Caches/pip
          key: desktop-runtime-${{ runner.os }}-darwin-x64-${{ hashFiles('scripts/prepare-desktop-runtime.mjs', 'python/orion-ui/pyproject.toml', 'python/orion-ui/orion_ui/**') }}
          restore-keys: |
            desktop-runtime-${{ runner.os }}-darwin-x64-

      - name: Prepare desktop package inputs
        env:
          APPDATA: ${{ github.workspace }}/.appdata
          HOME: ${{ github.workspace }}
          LOCALAPPDATA: ${{ github.workspace }}/.localappdata
          USERPROFILE: ${{ github.workspace }}
        run: npm run build:desktop-main && npm run prepare:desktop-runtime

      - name: Package macOS app
        env:
          ORION_ADHOC_MAC_SIGNING: "1"
        run: npx electron-builder --mac dmg zip --publish never -c.mac.identity=null -c.mac.hardenedRuntime=false

      - name: Prepare macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          cp dist/electron/Orion-${{ needs.release-info.outputs.version }}-mac-x64.dmg dist/release-assets/
          cp dist/electron/Orion-${{ needs.release-info.outputs.version }}-mac-x64.zip dist/release-assets/
          cp dist/electron/latest-mac.yml dist/release-assets/latest-x64-mac.yml
          find dist/electron -maxdepth 1 -type f -name "*.blockmap" -exec cp {} dist/release-assets/ \;
          (cd dist/release-assets && shasum -a 256 * > SHA256SUMS-darwin-x64.txt)

      - name: Upload desktop assets to release
        uses: actions/upload-artifact@v4
        with:
          name: desktop-darwin-x64
          path: dist/release-assets/*
          if-no-files-found: error

  publish-release:
    needs:
      - release-info
      - app-bundle
      - desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release-info.outputs.version }}"
          required=(
            "orion-app-${version}.tar.gz"
            "Orion-${version}-mac-arm64.dmg"
            "Orion-${version}-mac-arm64.zip"
            "Orion-Setup-${version}-win-x64.exe"
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ ! -f "dist/release-assets/${name}" ]]; then
              missing+=("${name}")
            fi
          done
          if ((${#missing[@]} > 0)); then
            printf 'Missing required release assets:\n' >&2
            printf '  %s\n' "${missing[@]}" >&2
            find dist/release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi

      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.release-info.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Desktop installers and app bundle for $tag. macOS Intel builds are uploaded separately when ready."
          fi
          gh release upload "$tag" dist/release-assets/* --clobber

  publish-intel-release:
    needs:
      - release-info
      - desktop-intel
      - publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Intel desktop artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-darwin-x64
          path: dist/release-assets

      - name: Verify Intel release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release-info.outputs.version }}"
          required=(
            "Orion-${version}-mac-x64.dmg"
            "Orion-${version}-mac-x64.zip"
            "latest-x64-mac.yml"
            "SHA256SUMS-darwin-x64.txt"
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ ! -f "dist/release-assets/${name}" ]]; then
              missing+=("${name}")
            fi
          done
          if ((${#missing[@]} > 0)); then
            printf 'Missing required Intel release assets:\n' >&2
            printf '  %s\n' "${missing[@]}" >&2
            find dist/release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi

      - name: Upload Intel assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.release-info.outputs.tag }}"
          gh release upload "$tag" dist/release-assets/* --clobber
