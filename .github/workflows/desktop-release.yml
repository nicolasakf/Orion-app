name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v; defaults to package.json"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" --title "$tag" --notes "Desktop installers and app bundle for $tag."

  app-bundle:
    needs: release-info
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build app bundle archive
        run: npm run prepack

      - name: Upload app bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ needs.release-info.outputs.tag }}" \
            "dist/orion-app-${{ needs.release-info.outputs.version }}.tar.gz" \
            --clobber

  desktop:
    needs: release-info
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            arch: arm64
            builder: mac
            updateChannel: latest-arm64
          - os: macos-13
            target: darwin-x64
            arch: x64
            builder: mac
            updateChannel: latest-x64
          - os: windows-latest
            target: win32-x64
            arch: x64
            builder: win
            updateChannel: latest-win-x64

    env:
      ORION_DESKTOP_TARGET: ${{ matrix.target }}
      ORION_HOME_DIR: ${{ runner.temp }}/orion-desktop-home
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build orion-ui wheel
        run: |
          python -m pip install --upgrade build
          python -m build
        working-directory: python/orion-ui

      - name: Validate macOS signing secrets
        if: matrix.builder == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "Missing macOS signing/notarization secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Validate Windows signing secrets
        if: matrix.builder == 'win'
        shell: pwsh
        run: |
          $missing = @()
          foreach ($name in @("WIN_CSC_LINK", "WIN_CSC_KEY_PASSWORD")) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            throw "Missing Windows signing secrets: $($missing -join ', ')"
          }

      - name: Prepare desktop package inputs
        run: npm run prepack:desktop

      - name: Package signed macOS app
        if: matrix.builder == 'mac'
        env:
          ORION_REQUIRE_MAC_NOTARIZATION: "1"
        run: npx electron-builder --mac dmg zip --publish never

      - name: Package signed Windows app
        if: matrix.builder == 'win'
        shell: pwsh
        run: npx electron-builder --win nsis --publish never

      - name: Prepare macOS release assets
        if: matrix.builder == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          cp dist/electron/Orion-${{ needs.release-info.outputs.version }}-mac-${{ matrix.arch }}.dmg dist/release-assets/
          cp dist/electron/Orion-${{ needs.release-info.outputs.version }}-mac-${{ matrix.arch }}.zip dist/release-assets/
          cp dist/electron/latest-mac.yml "dist/release-assets/${{ matrix.updateChannel }}-mac.yml"
          find dist/electron -maxdepth 1 -type f -name "*.blockmap" -exec cp {} dist/release-assets/ \;
          (cd dist/release-assets && shasum -a 256 * > "SHA256SUMS-${{ matrix.target }}.txt")

      - name: Prepare Windows release assets
        if: matrix.builder == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\release-assets | Out-Null
          Copy-Item "dist\electron\Orion-Setup-${{ needs.release-info.outputs.version }}-win-x64.exe" dist\release-assets\
          Copy-Item "dist\electron\latest.yml" "dist\release-assets\${{ matrix.updateChannel }}.yml"
          Get-ChildItem dist\electron -Filter "*.blockmap" | Copy-Item -Destination dist\release-assets\
          Get-ChildItem dist\release-assets -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Out-File -FilePath "dist\release-assets\SHA256SUMS-${{ matrix.target }}.txt" -Encoding utf8

      - name: Upload desktop assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ needs.release-info.outputs.tag }}" dist/release-assets/* --clobber
