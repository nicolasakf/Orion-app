name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v; defaults to package.json"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  app-bundle:
    needs: release-info
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build app bundle archive
        run: npm run prepack

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: dist/orion-app-${{ needs.release-info.outputs.version }}.tar.gz
          if-no-files-found: error

  desktop:
    needs: release-info
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            arch: arm64
            builder: mac
            updateChannel: latest-arm64
          - os: macos-15-intel
            target: darwin-x64
            arch: x64
            builder: mac
            updateChannel: latest-x64
          - os: windows-latest
            target: win32-x64
            arch: x64
            builder: win
            updateChannel: latest-win-x64

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ORION_DESKTOP_TARGET: ${{ matrix.target }}
      ORION_HOME_DIR: ${{ github.workspace }}/.orion-desktop-home
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build orion-ui wheel
        run: |
          python -m pip install --upgrade build
          python -m build
        working-directory: python/orion-ui

      - name: Prepare desktop package inputs
        run: npm run prepack:desktop

      - name: Package macOS app
        if: matrix.builder == 'mac'
        run: npx electron-builder --mac dmg zip --publish never

      - name: Package Windows app
        if: matrix.builder == 'win'
        shell: pwsh
        run: npx electron-builder --win nsis --publish never

      - name: Prepare macOS release assets
        if: matrix.builder == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          cp dist/electron/Orion-${{ needs.release-info.outputs.version }}-mac-${{ matrix.arch }}.dmg dist/release-assets/
          cp dist/electron/Orion-${{ needs.release-info.outputs.version }}-mac-${{ matrix.arch }}.zip dist/release-assets/
          cp dist/electron/latest-mac.yml "dist/release-assets/${{ matrix.updateChannel }}-mac.yml"
          find dist/electron -maxdepth 1 -type f -name "*.blockmap" -exec cp {} dist/release-assets/ \;
          (cd dist/release-assets && shasum -a 256 * > "SHA256SUMS-${{ matrix.target }}.txt")

      - name: Prepare Windows release assets
        if: matrix.builder == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\release-assets | Out-Null
          Copy-Item "dist\electron\Orion-Setup-${{ needs.release-info.outputs.version }}-win-x64.exe" dist\release-assets\
          Copy-Item "dist\electron\latest.yml" "dist\release-assets\${{ matrix.updateChannel }}.yml"
          Get-ChildItem dist\electron -Filter "*.blockmap" | Copy-Item -Destination dist\release-assets\
          Get-ChildItem dist\release-assets -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Out-File -FilePath "dist\release-assets\SHA256SUMS-${{ matrix.target }}.txt" -Encoding utf8

      - name: Upload desktop assets to release
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/release-assets/*
          if-no-files-found: error

  publish-release:
    needs:
      - release-info
      - app-bundle
      - desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release-info.outputs.version }}"
          required=(
            "orion-app-${version}.tar.gz"
            "Orion-${version}-mac-arm64.dmg"
            "Orion-${version}-mac-arm64.zip"
            "Orion-${version}-mac-x64.dmg"
            "Orion-${version}-mac-x64.zip"
            "Orion-Setup-${version}-win-x64.exe"
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ ! -f "dist/release-assets/${name}" ]]; then
              missing+=("${name}")
            fi
          done
          if ((${#missing[@]} > 0)); then
            printf 'Missing required release assets:\n' >&2
            printf '  %s\n' "${missing[@]}" >&2
            find dist/release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi

      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.release-info.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Desktop installers and app bundle for $tag."
          fi
          gh release upload "$tag" dist/release-assets/* --clobber
