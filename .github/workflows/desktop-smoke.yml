name: Desktop Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"os":"macos-15","target":"darwin-arm64","builder":"mac"},{"os":"windows-latest","target":"win32-x64","builder":"win"}]}' || '{"include":[{"os":"macos-15","target":"darwin-arm64","builder":"mac"},{"os":"macos-15-intel","target":"darwin-x64","builder":"mac"},{"os":"windows-latest","target":"win32-x64","builder":"win"}]}') }}

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
      ORION_DESKTOP_TARGET: ${{ matrix.target }}
      ORION_HOME_DIR: ${{ github.workspace }}/.orion-desktop-home

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build orion-ui wheel
        run: |
          python -m pip install --upgrade build
          python -m build
        working-directory: python/orion-ui

      - name: Cache desktop runtime downloads
        uses: actions/cache@v4
        with:
          path: |
            dist/desktop-runtime/downloads
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: desktop-runtime-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('scripts/prepare-desktop-runtime.mjs', 'python/orion-ui/pyproject.toml', 'python/orion-ui/orion_ui/**') }}
          restore-keys: |
            desktop-runtime-${{ runner.os }}-${{ matrix.target }}-

      - name: Prepare desktop package inputs
        env:
          APPDATA: ${{ github.workspace }}/.appdata
          HOME: ${{ github.workspace }}
          LOCALAPPDATA: ${{ github.workspace }}/.localappdata
          USERPROFILE: ${{ github.workspace }}
        run: npm run prepack:desktop

      - name: Package macOS app
        if: matrix.builder == 'mac'
        env:
          ORION_ADHOC_MAC_SIGNING: "1"
        run: npx electron-builder --mac dir --publish never -c.mac.identity=null -c.mac.hardenedRuntime=false

      - name: Package Windows app
        if: matrix.builder == 'win'
        shell: pwsh
        run: npx electron-builder --win dir --publish never

      - name: Smoke packaged macOS app
        if: matrix.builder == 'mac'
        run: |
          set -euo pipefail
          app_path="$(find dist/electron -name Orion.app -type d -print -quit)"
          "$app_path/Contents/MacOS/Orion" --smoke 2>"$RUNNER_TEMP/desktop-smoke.stderr" > "$RUNNER_TEMP/desktop-smoke.json"
          # The Jupyter Python must live in the persistent runtime directory, not inside
          # the app bundle, or user package installs are wiped by the next update.
          python -c 'import json, os; report=json.load(open(os.environ["RUNNER_TEMP"] + "/desktop-smoke.json", encoding="utf-8")); assert report["ok"], report; assert report["app"]["url"].startswith("http://127.0.0.1:"), report; assert report["cloud"]["configured"], report; assert report["jupyter"]["source"] == "managed", report; assert report["jupyter"]["pythonPath"].startswith(os.environ["ORION_HOME_DIR"]), report'

      - name: Smoke packaged Windows app
        if: matrix.builder == 'win'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\electron -Recurse -Filter Orion.exe | Where-Object { $_.FullName -match "win-unpacked" } | Select-Object -First 1
          & $exe.FullName --smoke 2>$env:RUNNER_TEMP\desktop-smoke.stderr | Out-File -FilePath "$env:RUNNER_TEMP\desktop-smoke.json" -Encoding utf8NoBOM
          $report = Get-Content "$env:RUNNER_TEMP\desktop-smoke.json" -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw ($report | ConvertTo-Json -Depth 20) }
          if (-not $report.app.url.StartsWith("http://127.0.0.1:")) { throw ($report | ConvertTo-Json -Depth 20) }
          if (-not $report.cloud.configured) { throw ($report | ConvertTo-Json -Depth 20) }
          if ($report.jupyter.source -ne "managed") { throw ($report | ConvertTo-Json -Depth 20) }
          # The Jupyter Python must live in the persistent runtime directory, not inside
          # the installation, or user package installs are wiped by the next update.
          # ORION_HOME_DIR is set with a forward slash, so normalize before comparing.
          $expectedHome = $env:ORION_HOME_DIR.Replace('/', '\')
          $actualPython = $report.jupyter.pythonPath.Replace('/', '\')
          if (-not $actualPython.StartsWith($expectedHome)) { throw ($report | ConvertTo-Json -Depth 20) }
